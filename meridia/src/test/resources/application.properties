# H2 Testing Settings
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.cleanDisabled=false


# See exactly when transactions start, join, or are marked "rollback-only"
logging.level.org.springframework.transaction=TRACE

# See the actual SQL being sent to H2
logging.level.org.hibernate.SQL=DEBUG

# See the values being bound to the SQL parameters (crucial for NOT NULL checks)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# See the underlying database errors before Spring wraps them
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=DEBUG